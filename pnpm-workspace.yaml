packages:
  - .
  - platform
  - example/client

allowBuilds:
  esbuild: false
  protobufjs: false
  sharp: false
  unrs-resolver: false

minimumReleaseAge: 10080 # 7 days in minutes

minimumReleaseAgeExclude:
  - pnpm@12.20.0

overrides:
  '@hono/node-server@>=1.19.10 <2.1.3': ^2.1.3
  chokidar: '>=5'
  katex@>=0.11.0 <0.18.2: ^0.18.2
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  re2js@>=2.2.0 <2.8.7: ^2.8.7
  semver: '>=7'
  undici: '>=6'

trustPolicy: no-downgrade
